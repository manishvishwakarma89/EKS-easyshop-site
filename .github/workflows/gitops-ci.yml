name: GitOPs CI- Build & Push to DockerHub

on:
  push:
    branches: [feat/hackathon]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

permissions: 
  contents: write

env:
  DOCKERHUB_REPO: manishvishwa801/easyshop-dhi

jobs:
   build-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'
       - name: Install dependencies
        run: npm ci

       - name: Run tests
        run: npm test --if-present

      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ${{ env.DOCKERHUB_REPO }}:latest
              ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update manifest and commit
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.sha_short }}

        run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"

           git fetch origin feat/gitops
           git reset --hard origin/feat/gitops

            sed -i "s|image: ${DOCKERHUB_REPO}:.*|image: ${DOCKERHUB_REPO}:${IMAGE_TAG}|" "$MANIFEST"
            grep -q "${DOCKERHUB_REPO}:${IMAGE_TAG}" "$MANIFEST" || { echo "Image line not found in $MANIFEST"; exit 1; }
    
            if git diff --quiet; then
                echo "No manifest changes to commit"
                exit 0
              fi
            git add "$MANIFEST"
            git commit -m "ci: update easyshop image to ${IMAGE_TAG} [skip ci]"
            git push origin feat/gitops

            
            
          
        


    
